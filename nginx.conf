    map "0:$access_ip_allow:$access_ip_deny" $access {
        default 1;

        # block ip
        "~.:.:1" 2;
        "~1:0:." 2;

        # allow ip
        "~.:1:." 1;
    }

    # Include user includes
    include /srv/.nginx/http_level/*.conf;

    server {
        server_name         powersaveac.com www.powersaveac.com;
        root                /srv/public_html/pub;
        listen              443 http2 ssl;

        # Include waf configuration
        include /srv/.nginx/waf/*.conf;

        include /srv/.nginx/server_level/*.conf;

        location /.1mmyinrteaxn1g22  {
            return 200 'validated';
        }

        ssl_certificate /etc/nginx/stratus/store.crt;
        ssl_certificate_key /etc/nginx/stratus/store.key;

        rewrite ^/home/(.*) /$1  permanent;

        #Lock extensions .bck .bak .save
        location ~* (\.bak|\.save|\.bck|\.ini)$ { deny all; }

        # Explicit block of Magento remote vulnerability
        location ~* /(index.php/|)filesystem/adminhtml_filesystem { deny all; }
        location ~* /(index.php/|)admin/Cms_Wysiwyg/ { deny all; }

        # Explicit block of Magento remote vulnerability
        location ~* /skin/adminhtml/default/default/media/flex.swf$ { deny all; }
        location ~* /skin/adminhtml/default/default/media/uploader.swf$ { deny all; }
        location ~* /skin/adminhtml/default/default/media/uploaderSingle.swf$ { deny all; }

        # Explicit block of Magento remote vulnerability
        location ~* /(index.php/|)customer/address_file/upload { deny all; }


        if ($access_ua != 1)  {
            return 503;
        }

        if ($access = 2)  {
            return 403;
        }

        if ($access != 1)  {
            return 503;
        }


        # set Varnish variable to default
        set $ssl_offloaded '';

        location /server-status {
            stub_status on;
            access_log   off;
            allow 127.0.0.1;
            allow 10.254.0.0/16;
            deny all;
        }
        location ~* /catalogsearch/ {
            limit_req zone=search burst=10;
            try_files $uri $uri/ /index.php?$args;
           location ~* \.php$ { try_files /dummy @proxy; }
        }




        
    

# Magento Vars
set $MAGE_ROOT /srv/public_html;

index index.php;
autoindex off;

add_header 'X-Live-Attribute' 'true';

location ~* /(\.ht|\.svn|\.git) { deny all; }
location ~* ^/(app|lib|pkginfo|report/config.xml|var)/ { deny all; }
location ~ ^/media/(customer|downloadable|import) { deny all; }
location ~ cron\.php { deny all; }


location /pub/ {
    location ~ ^/pub/media/(downloadable|customer|import|theme_customization/.*\.xml) {
        deny all;
    }
    alias $MAGE_ROOT/pub/;
    add_header X-Frame-Options "SAMEORIGIN";
}

location ~* ^/setup($|/) {
    root $MAGE_ROOT;
    location ~ ^/setup/index.php {
        try_files /dummy @proxy2;
    }

    location ~ ^/setup/(?!pub/). {
        deny all;
    }

    location ~ ^/setup/pub/ {
        add_header X-Frame-Options "SAMEORIGIN";
    }
}

# PHP entry point for update application
location ~* ^/update($|/) {
    root $MAGE_ROOT;

    location ~ ^/update/index.php {
        try_files /dummy @proxy2;
    }

    # Deny everything but index.php
    location ~ ^/update/(?!pub/). {
        deny all;
    }

    location ~ ^/update/pub/ {
        add_header X-Frame-Options "SAMEORIGIN";
    }
}

location /static/ {
    # Uncomment the following line in production mode
    expires max;

    # Remove signature of the static files that is used to overcome the browser cache
    location ~ ^/static/version {
        rewrite ^/static/(version\d*/)?(.*)$ /static/$2 last;
    }

    location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|webp|woff|woff2)$ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN";
        expires +1y;

        if (!-f $request_filename) {
            rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
        }
    }
    location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN";
        expires    off;

        if (!-f $request_filename) {
           rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
        }
    }
    if (!-f $request_filename) {
        rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
    }
    add_header X-Frame-Options "SAMEORIGIN";
}

location /media/ {
    try_files $uri $uri/ /get.php$is_args$args;

    location ~ ^/media/theme_customization/.*\.xml {
        deny all;
    }

    location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|webp|woff|woff2)$ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN";
        expires +1y;
        try_files $uri $uri/ /get.php$is_args$args;
    }

    location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN";
        expires    off;
        try_files $uri $uri/ /get.php$is_args$args;
    }
    add_header X-Frame-Options "SAMEORIGIN";
}

location ~ /static\.php {
    try_files $uri =404;
    expires off;
    fastcgi_pass php-fpm;
    fastcgi_keep_conn on;
    fastcgi_buffer_size 128k;
    fastcgi_buffers    4 256k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /cache/pub$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT /cache/pub;
    fastcgi_param MAGE_RUN_CODE $magento_multistore_key;
    fastcgi_param MAGE_RUN_TYPE $magento_multistore_type;
    fastcgi_param UNIQUE_ID $connection.$connection_requests;
    fastcgi_param HTTPS $http_x_ssl_offloaded if_not_empty;
}

